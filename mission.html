<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>Economics Rescue</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20">
  <script defer src="assets/js/theme.js?v=20"></script>
  <script defer src="assets/js/site.js?v=20"></script>
  <script defer src="assets/js/engine.js?v=20"></script>
  <script defer src="assets/js/mission-meta.js?v=20"></script>
  <script defer src="assets/js/mission-loader.js?v=20"></script>
  <style>body::after{content:"";position:fixed;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--mission-a,#7c6cff),var(--mission-b,#5eead4));z-index:100;pointer-events:none}</style>
</head>
<body>
  <div class="site">
    <div class="top">
      <a href="index.html" class="brand" id="missionBrand">ECONOMICS RESCUE</a>
      <div class="stats">
        <button class="themeToggle" data-theme-toggle>☀️ Light</button>
        <div class="pill">⭐ <span id="xp">0</span> XP</div>
        <div class="pill">🔥 <span id="streak">0</span></div>
        <div class="pill">🔊 <span id="snd">ON</span></div>
      </div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="missionNav">
      <a class="navBtn" href="menu.html">☰ Course menu</a>
      <a class="navBtn" id="unitMapLink" href="demand.html">Demand map</a>
      <button class="navBtn" id="restartMission" type="button">↺ Restart mission</button>
      <select class="pageJump" id="pageJump" aria-label="Jump to lesson page"><option>Loading mission…</option></select>
    </div>
    <main class="card" id="main"><div class="loadingState"><div class="eyebrow">Loading mission</div><h2>Getting your lesson ready…</h2></div></main>
    <div class="actions">
      <button class="btn secondary" id="back">← Back</button>
      <button class="btn softBtn" id="hint">I don't get it</button>
      <button class="btn softBtn" id="sound">Sound on/off</button>
      <button class="btn primary" id="next">Continue →</button>
    </div>
  </div>
  <div id="confetti" class="confetti hidden"></div>
</body>
</html>
