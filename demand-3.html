<style>
:root{--bg:#f7f3eb;--card:#fff;--ink:#17202d;--muted:#667085;--line:#e4dfd5;--accent:#5b5bd6;--accent2:#8b5cf6;--soft:#efefff;--good:#146b42;--goodbg:#eaf7ef;--bad:#9e241b;--badbg:#fff0ed;--warn:#795600;--warnbg:#fff7d6;--dark:#111827}

.score{font-size:56px;font-weight:950;letter-spacing:-.05em}.mini{font-size:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:center}.table th:first-child,.table td:first-child{text-align:left}

<body>
<div class="app">
 <div class="top">
  <a href="index.html" class="brand">ECONOMICS RESCUE <span style="color:#777">/ DEMAND 3/6</span></a>
  <div class="stats"><div class="pill">⭐ <span id="xp">0</span> XP</div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🔊 <span id="snd">ON</span></div></div>
 </div>
 <div class="bar"><div class="fill" id="fill"></div></div>
 <main class="card" id="main"></main>
 <div class="actions"><button class="btn secondary" id="back">← Back</button><button class="btn softBtn" id="hint">I don't get it</button><button class="btn softBtn" id="sound">Sound on/off</button><button class="btn primary" id="next">Continue →</button></div>
</div>
<div id="confetti" class="confetti hidden"></div>

<script>
(function(){
const KEY="econ_demand_m3_games_v1";
let state=Object.assign({i:0,xp:0,streak:0,sound:true,rewarded:{}},JSON.parse(localStorage.getItem(KEY)||"{}"));
const screens=[
 {t:"intro"},{t:"graphMeaning"},{t:"fiveReasons"},{t:"dmuGame"},{t:"incomeGame"},{t:"subGame"},
 {t:"newBuyers"},{t:"manyUses"},{t:"reasonSort"},{t:"chainGame"},{t:"exceptionsIntro"},
 {t:"giffen"},{t:"snob"},{t:"otherExceptions"},{t:"exceptionSort"},{t:"fakeException"},
 {t:"upwardGraph"},{t:"fixEconomist"},{t:"board"},{t:"boss"},{t:"bridge"},{t:"finish"}
];
function $(id){return document.getElementById(id)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(kind){if(!state.sound)return;try{const C=new(window.AudioContext||window.webkitAudioContext)(),o=C.createOscillator(),g=C.createGain(),m={click:[430,520,.05],good:[620,880,.10],bad:[220,170,.12],win:[523,1046,.24]}[kind]||[430,520,.05];o.connect(g);g.connect(C.destination);o.frequency.setValueAtTime(m[0],C.currentTime);o.frequency.exponentialRampToValueAtTime(m[1],C.currentTime+m[2]);g.gain.setValueAtTime(.035,C.currentTime);g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+m[2]);o.start();o.stop(C.currentTime+m[2])}catch(e){}}
function burst(){const c=$("confetti");c.innerHTML="";c.classList.remove("hidden");const cs=["#5b5bd6","#ffd166","#34d399","#60a5fa","#f472b6"];for(let i=0;i<28;i++){const d=document.createElement("div");d.className="piece";d.style.left=Math.random()*100+"vw";d.style.top=(-20-Math.random()*30)+"px";d.style.background=cs[Math.floor(Math.random()*cs.length)];c.appendChild(d)}setTimeout(()=>c.classList.add("hidden"),1300)}
function reward(k,n=45){if(!state.rewarded[k]){state.rewarded[k]=1;state.xp+=n;burst()}state.streak++;tone("good");save();header()}
function miss(){state.streak=0;tone("bad");save();header()}
function header(){$("xp").textContent=state.xp;$("streak").textContent=state.streak;$("snd").textContent=state.sound?"ON":"OFF";$("fill").style.width=((state.i+1)/screens.length*100)+"%";$("back").disabled=state.i===0;$("next").textContent=state.i===screens.length-1?"Continue to Demand 4 →":"Continue →"}
function fb(ok,title,why){const f=$("fb");f.className="feedback show "+(ok?"good":"bad");f.innerHTML=`<b>${ok?"✓":"✗"} ${title}</b><br>${why}`}
function def(term,plain,formal,icon){return `<div class="definition"><div class="term">${icon||""} ${term}</div><div>${plain}</div><div class="formal"><b>ISC wording:</b> ${formal}</div></div>`}
function quiz(title,qs,key){
 let i=0,score=0;$("main").innerHTML=`<div class="eyebrow">Game</div><h2>${title}</h2><div id="g"></div><div id="fb" class="feedback"></div>`;
 function show(){const q=qs[i],choices=shuffle(q.a.map((text,j)=>({text,ok:j===q.c})));$("g").innerHTML=`<div class="scene"><p class="big">${q.q}</p></div><div class="answers">${choices.map((x,j)=>`<button class="ans" data-x="${j}">${x.text}</button>`).join("")}</div>`;document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const ok=choices[+b.dataset.x].ok;if(ok)score++;fb(ok,ok?"Correct":"Not quite",q.why);ok?tone("good"):miss();i++;if(i<qs.length)setTimeout(()=>{$("fb").className="feedback";show()},700);else setTimeout(()=>{$("g").innerHTML=`<div class="panel ${score>=Math.ceil(qs.length*.75)?"goodbg":"warnbg"}"><div class="score">${score}/${qs.length}</div><p>${score>=Math.ceil(qs.length*.75)?"You recognized the mechanism across new examples.":"Review the explanations, then try again later."}</p></div>`;reward(key,score*18)},450)})}
 show()
}
function graphGrid(ctx,w,h,positive){
 const m=64,maxQ=10,maxP=100,pw=w-m-28,ph=h-m-28,qTicks=[0,2,4,6,8,10],pTicks=[0,20,40,60,80,100];
 ctx.font="12px system-ui";
 qTicks.forEach(v=>{const x=m+(v/maxQ)*pw;ctx.strokeStyle=v===0?"#98a2b3":"#e4e7ec";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,18);ctx.lineTo(x,h-m);ctx.stroke();ctx.fillStyle="#475467";ctx.textAlign="center";ctx.fillText(String(v),x,h-m+20)});
 pTicks.forEach(v=>{const y=(h-m)-(v/maxP)*ph;ctx.strokeStyle=v===0?"#98a2b3":"#e4e7ec";ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-28,y);ctx.stroke();ctx.fillStyle="#475467";ctx.textAlign="right";ctx.fillText(v===0?"0":"₹"+v,m-8,y+4)});
 ctx.strokeStyle="#667085";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m,18);ctx.lineTo(m,h-m);ctx.lineTo(w-28,h-m);ctx.stroke();ctx.fillStyle="#344054";ctx.font="bold 13px system-ui";ctx.textAlign="left";ctx.fillText("PRICE (₹)",8,16);ctx.textAlign="right";ctx.fillText("QUANTITY DEMANDED",w-28,h-12);ctx.textAlign="left";
 const pts=positive?[[2,20],[4,40],[6,60],[8,80]]:[[2,80],[4,60],[6,40],[8,20]];
 ctx.strokeStyle=positive?"#ef8b3d":"#5b5bd6";ctx.lineWidth=4;ctx.beginPath();pts.forEach((p,i)=>{const x=m+(p[0]/maxQ)*pw,y=(h-m)-(p[1]/maxP)*ph;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
}

function render(){
 header();const t=screens[state.i].t,m=$("main");
 if(t==="intro")m.innerHTML=`<div class="eyebrow">Mission 3 • Why D Slopes Down</div><h1>Why does cheaper usually mean more?</h1><p class="big">You already know the Law of Demand. Now you'll learn <b>why</b> it happens — and why some weird cases seem to break it.</p><div class="scene"><div class="bigIcon">₹100 ↓ ₹60 → 🛒↑</div><p>The line slopes downward because there are economic mechanisms underneath it.</p></div>`;
 else if(t==="graphMeaning"){m.innerHTML=`<div class="eyebrow">Start with the graph</div><h2>“Downward sloping” is an economic statement.</h2><div class="chartwrap"><canvas id="gph" width="800" height="345"></canvas></div><div class="labels"><span class="tag">Y = Price</span><span class="tag">X = Quantity demanded</span><span class="tag">Other things unchanged</span></div><div class="feedback show hint">Move right along a normal demand curve: quantity demanded is higher while price is lower. That's the inverse relationship.</div>`;setTimeout(()=>graphGrid($("gph").getContext("2d"),800,345,false),0)}
 else if(t==="fiveReasons")m.innerHTML=`<div class="eyebrow">Frank's five explanations</div><h2>Five reasons the demand curve slopes downward.</h2><div class="grid3"><div class="panel"><div class="bigIcon">🍕</div><b>Diminishing marginal utility</b><p>Extra units usually give less extra satisfaction.</p></div><div class="panel"><div class="bigIcon">💰</div><b>Income effect</b><p>A lower price increases real purchasing power.</p></div><div class="panel"><div class="bigIcon">🔁</div><b>Substitution effect</b><p>The good becomes cheaper relative to alternatives.</p></div><div class="panel"><div class="bigIcon">🚪👥</div><b>More consumers enter</b><p>At lower prices, people previously priced out may start buying.</p></div><div class="panel"><div class="bigIcon">⚡🏠🍳</div><b>Several uses</b><p>At lower prices, a good may be used for less-important additional purposes.</p></div></div>`;
 else if(t==="dmuGame"){let mus=[50,32,18,7,1];m.innerHTML=`<div class="eyebrow">Reason 1 • Diminishing marginal utility</div><h2>Eat another slice.</h2>${def("Marginal utility","The <b>extra satisfaction</b> from one additional unit.","The addition to total utility obtained from consuming one more unit.","🍕")}<input id="slice" class="range" type="range" min="1" max="5" value="1"><div class="grid2" style="margin-top:14px"><div class="panel"><b>Slice</b><div class="value" id="sv">1</div></div><div class="panel goodbg"><b>Extra satisfaction</b><div class="value" id="mv">50</div></div></div><div class="feedback show hint">If the 5th slice gives almost no extra satisfaction, you'd usually only buy it if the price were low enough.</div>`;setTimeout(()=>{$("slice").oninput=()=>{$("sv").textContent=$("slice").value;$("mv").textContent=mus[+$("slice").value-1];tone("click")}},0)}
 else if(t==="incomeGame"){m.innerHTML=`<div class="eyebrow">Reason 2 • Income effect</div><h2>Your salary didn't rise. Why do you feel richer?</h2>${def("Income effect","When a price falls, the same money can buy more. Your <b>real purchasing power</b> rises.","The change in quantity demanded arising from the change in real income caused by a price change.","💰")}<div class="grid2"><div class="panel"><b>Budget: ₹500</b><p>Meal price ₹100</p><div class="wallet">🍛🍛🍛🍛🍛</div><b>5 meals</b></div><div class="panel goodbg"><b>Budget: still ₹500</b><p>Meal price ₹50</p><div class="wallet">🍛🍛🍛🍛🍛🍛🍛🍛🍛🍛</div><b>10 meals possible</b></div></div><div class="feedback show hint">Money income stayed ₹500. <b>Real income</b> — what ₹500 can buy — increased.</div>`}
 else if(t==="subGame")quiz("Which mechanism is this?",[
   {q:"Coke falls from ₹60 to ₹40 while Pepsi stays ₹60. Some Pepsi buyers switch to Coke.",a:["Substitution effect","Income effect","Several uses"],c:0,why:"Coke became cheaper relative to its substitute Pepsi, so consumers switch toward Coke."},
   {q:"A streaming service cuts price while rival services stay the same price. Some users switch.",a:["Substitution effect","More consumers only","Giffen effect"],c:0,why:"Relative prices changed, making one substitute more attractive."},
   {q:"A metro ticket becomes cheaper relative to an app cab for the same trip.",a:["Income effect only","Substitution effect","Composite demand"],c:1,why:"The consumer compares alternatives and shifts toward the relatively cheaper one."}
 ],"subGame")
 else if(t==="newBuyers")m.innerHTML=`<div class="eyebrow">Reason 4 • Increase in number of consumers</div><h2>A lower price can open the door to new buyers.</h2>${def("Increase in number of consumers","At a high price, some potential consumers may not buy at all. At a lower price, they enter the market.","A lower price may attract additional consumers, increasing quantity demanded in the market.","🚪👥")}<div class="grid2"><div class="panel"><b>Concert stream: ₹1,500</b><p>👤 👤</p><p>Only a few buyers.</p></div><div class="panel goodbg"><b>Concert stream: ₹300</b><p>👤 👤 👤 👤 👤 👤</p><p>More people can/will enter.</p></div></div>`;
 else if(t==="manyUses")m.innerHTML=`<div class="eyebrow">Reason 5 • Several uses</div><h2>Cheap enough? Use it for more things.</h2>${def("Several uses","A commodity with many possible uses is reserved for important uses when expensive, but used more broadly when cheap.","A fall in price encourages extension of the commodity to less important uses, increasing quantity demanded.","⚡")}<div class="grid2"><div class="panel"><b>Electricity very expensive</b><p>💡 Lighting only / essential uses</p></div><div class="panel goodbg"><b>Electricity cheaper</b><p>💡 + 🍳 + ❄️ + 🧺</p><p>More uses become worthwhile.</p></div></div>`;
 else if(t==="reasonSort")quiz("Why did quantity demanded rise?",[
   {q:"Apples get cheaper. Your ₹500 grocery budget now has more purchasing power.",a:["Income effect","Substitution effect","Several uses","More consumers"],c:0,why:"The price fall increases real purchasing power."},
   {q:"Tea gets cheaper while coffee stays the same price, so some coffee drinkers switch.",a:["Several uses","Substitution effect","Income effect","More consumers"],c:1,why:"The good becomes cheaper relative to a substitute."},
   {q:"Electricity becomes cheaper, so a household uses it for additional appliances.",a:["Several uses","More consumers","Income effect","DMU"],c:0,why:"A multi-use commodity is extended to additional uses when cheaper."},
   {q:"A ₹2,000 course becomes ₹200 and students who previously couldn't justify it start buying.",a:["More consumers","Several uses","DMU","Giffen"],c:0,why:"The lower price attracts buyers who were previously outside the market."},
   {q:"The tenth chocolate gives much less extra satisfaction than the first.",a:["Diminishing marginal utility","Substitution effect","More consumers","Quality-price"],c:0,why:"Additional units provide progressively less extra utility."}
 ],"reasonSort")
 else if(t==="chainGame")renderChainGame()
 else if(t==="exceptionsIntro")m.innerHTML=`<div class="eyebrow">Now the weird part</div><h2>When might the usual rule not appear to hold?</h2><p>Frank lists six exceptions. For the exam, know all six.</p><div class="grid3"><div class="panel"><b>Giffen goods</b></div><div class="panel"><b>Snob / Veblen goods</b></div><div class="panel"><b>Future-price expectations</b></div><div class="panel"><b>Emergencies</b></div><div class="panel"><b>Quality–price relationship</b></div><div class="panel"><b>Change in fashion</b></div></div><div class="feedback show hint"><b>Important:</b> some are genuine unusual price-response stories; others are better understood as cases where “other things equal” no longer holds.</div>`;
 else if(t==="giffen")m.innerHTML=`<div class="eyebrow">Exception 1 • Giffen goods</div><h2>The deliberately weird staple-food case.</h2>${def("Giffen good","A very special inferior staple taking a large share of a poor consumer's budget, where a price rise can lead to more being bought because the negative real-income effect is extremely strong.","An inferior good for which quantity demanded may rise when its price rises under restrictive conditions.","🌾")}<div class="scene"><p>Imagine a household relies heavily on a cheap staple. If its price rises sharply, the household becomes effectively poorer and may be forced to cut expensive foods and rely <b>even more</b> on the staple.</p></div><div class="feedback show hint"><b>Do not generalize:</b> all Giffen goods are inferior goods, but ordinary inferior goods are not automatically Giffen goods.</div>`;
 else if(t==="snob")m.innerHTML=`<div class="eyebrow">Exception 2 • Snob / Veblen goods</div><h2>Sometimes expensive is part of the appeal.</h2>${def("Snob / Veblen-type good","For some prestige goods, a high price can signal exclusivity or status, making the item attractive to status-conscious buyers.","Goods of conspicuous consumption may be demanded partly because their high price confers prestige.","⌚👑")}<div class="grid2"><div class="panel"><b>Normal good</b><p>Higher price usually discourages buying.</p></div><div class="panel warnbg"><b>Status good</b><p>For some buyers, a very high price itself can be part of the status signal.</p></div></div>`;
 else if(t==="otherExceptions")m.innerHTML=`<div class="eyebrow">Frank's other four</div><h2>Learn the textbook list — understand what changed.</h2><div class="grid2">
   <div class="panel"><b>🔮 Expected future prices</b><p>If people expect prices to rise even more, they may buy more now despite today's higher price.</p></div>
   <div class="panel"><b>🚨 Emergencies</b><p>War, shortages or disasters can trigger hoarding even at high prices.</p></div>
   <div class="panel"><b>🏷️ Quality–price relationship</b><p>Some buyers use price as a signal of quality and may prefer the more expensive option.</p></div>
   <div class="panel"><b>👗 Change in fashion</b><p>A fashionable item may sell more even while its price rises because tastes changed.</p></div></div><div class="feedback show hint"><b>Concept check:</b> expectations, emergencies and fashion also change other determinants of demand. So they are textbook “exceptions,” but not clean ceteris-paribus experiments.</div>`;
 else if(t==="exceptionSort")quiz("Which textbook exception best fits?",[
   {q:"People expect cooking-oil prices to rise sharply next week, so they stock up today even after today's price rose.",a:["Expected future prices","Giffen good","Several uses","Income effect"],c:0,why:"Expected future prices changed current buying behaviour."},
   {q:"A luxury handbag becomes more desirable to status-conscious buyers precisely because it is extremely expensive.",a:["Snob / Veblen","Giffen","Emergency","Income effect"],c:0,why:"The price contributes to prestige or exclusivity."},
   {q:"During an announced shortage, households hoard bottled water despite very high prices.",a:["Emergency","Composite demand","Substitution effect","Ex-post demand"],c:0,why:"Abnormal emergency conditions can overwhelm ordinary buying patterns."},
   {q:"A buyer assumes a ₹40,000 speaker must be better than a ₹4,000 speaker mainly because of price.",a:["Quality–price relationship","Giffen","Several uses","Income effect"],c:0,why:"Price is being used as a proxy for perceived quality."},
   {q:"A clothing style goes viral and sales rise even while its price increases.",a:["Change in fashion","Giffen","Income effect","Several uses"],c:0,why:"Tastes/fashion changed at the same time as price."}
 ],"exceptionSort")
 else if(t==="fakeException")quiz("Is this enough evidence of a true Law-of-Demand exception?",[
   {q:"Concert ticket prices rose and sales also rose after the artist suddenly went viral.",a:["Yes, definitely a pure exception","Not necessarily — demand may have shifted because popularity changed","It proves a Giffen good"],c:1,why:"Popularity is a demand determinant. If tastes changed, ceteris paribus did not hold."},
   {q:"Umbrella prices rose during a cyclone warning and people bought more.",a:["Automatically a pure upward-sloping demand curve","Not necessarily — emergency conditions changed demand","This is diminishing marginal utility"],c:1,why:"The emergency changed willingness to buy at many prices. That's not a clean own-price-only comparison."},
   {q:"The same ordinary product's price rises while every other relevant factor truly stays unchanged, and quantity demanded consistently rises.",a:["That would contradict the normal Law of Demand relationship","That is just a rightward shift","That is income demand"],c:0,why:"Now we have isolated own price while holding other determinants constant."}
 ],"fakeException")
 else if(t==="upwardGraph"){m.innerHTML=`<div class="eyebrow">Graph the exception</div><h2>What does a textbook exception look like?</h2><div class="plotGrid"><div class="panel"><table class="table"><tr><th>Price</th><th>Qd</th></tr><tr><td>₹20</td><td>2</td></tr><tr><td>₹40</td><td>4</td></tr><tr><td>₹60</td><td>6</td></tr><tr><td>₹80</td><td>8</td></tr></table><p class="mini">Here price and quantity move in the <b>same</b> direction.</p></div><div><div class="chartwrap"><canvas id="up" width="800" height="345"></canvas></div><div class="labels"><span class="tag">Positive slope</span><span class="tag">Exception pattern</span></div></div></div><div class="feedback show hint">This is the opposite of an ordinary demand curve. Treat it as exceptional, not the default.</div>`;setTimeout(()=>graphGrid($("up").getContext("2d"),800,345,true),0)}
 else if(t==="fixEconomist")quiz("Fix the bad economics",[
   {q:"“Any time price and sales rise together, the Law of Demand has been disproved.”",a:["Correct","Wrong: another demand determinant may have shifted the curve","Wrong: the Law of Demand says price and quantity always rise together","Correct only for normal goods"],c:1,why:"Before calling something an exception, ask whether other determinants changed."},
   {q:"“All inferior goods are Giffen goods.”",a:["Correct","Wrong: Giffen is a much narrower special case","Correct if price rises","Wrong because Giffen goods are luxury goods"],c:1,why:"Giffen goods are a special subset; ordinary inferior goods need not have upward-sloping demand."},
   {q:"“Income effect means your money salary must change.”",a:["Correct","Wrong: a price change can alter real purchasing power even with the same money income","Correct only for substitutes","Wrong because income effect means population rises"],c:1,why:"Real income/purchasing power can change because prices change."},
   {q:"“Several uses means the good has several buyers.”",a:["Correct","Wrong: it means the same commodity can serve multiple uses","Correct only for market demand","Wrong: it means substitute goods"],c:1,why:"Several uses is about uses of the commodity, not number of consumers."}
 ],"fixEconomist")
 else if(t==="board")renderBoard()
 else if(t==="boss")renderBoss()
 else if(t==="bridge")m.innerHTML=`<div class="eyebrow">Bridge to Mission 4</div><h2>One reason is still hiding a whole theory.</h2><div class="scene"><div class="bigIcon">🍕 50 → 32 → 18 → 7 → 1</div><p>We said extra satisfaction from each additional unit tends to fall. That's <b>diminishing marginal utility</b>.</p></div><p class="big">Next mission, we stop using it as a one-line explanation and actually learn TU, MU, the Law of Diminishing Marginal Utility and consumer equilibrium.</p>`;
 else m.innerHTML=`<div class="eyebrow">Mission complete</div><h1>Curve Detective 🔎</h1><p class="big">You now know all five Frank explanations for the downward slope, all six textbook exceptions, and how to tell a genuine price-response story from a case where other things changed.</p><div class="feedback show good">Next: The Last Slice — utility, TU and MU.</div>`;
 save()
}
function renderChainGame(){
 const target=["price falls","real purchasing power rises","consumer can afford more","quantity demanded rises"],decoys=["supply falls","population disappears"];
 $("main").innerHTML=`<div class="eyebrow">Game • Build the causal chain</div><h2>Build the income-effect explanation.</h2><div class="tileWrap">${shuffle(target.concat(decoys)).map(x=>`<button class="tile" data-v="${x}">${x}</button>`).join("")}</div><div id="slot" class="slot">Tap the steps in order…</div><button class="btn primary" id="check">Check chain</button><div id="fb" class="feedback"></div>`;
 const chosen=[];document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{if(b.classList.contains("used"))return;chosen.push(b.dataset.v);b.classList.add("used");$("slot").innerHTML=chosen.map(x=>`<span class="tag">${x}</span>`).join(" → ");tone("click")});
 $("check").onclick=()=>{const ok=chosen.length===target.length&&target.every((x,i)=>chosen[i]===x);fb(ok,ok?"Causal chain built":"The order matters",ok?"Price falls → real purchasing power rises → the consumer can afford more → quantity demanded rises.":"Start with the price change. Ask what that does to real purchasing power, then what the consumer can do.");ok?reward("chain",80):miss()}
}
function renderBoard(){
 $("main").innerHTML=`<div class="eyebrow">Board challenge</div><h2>Answer: Why does a demand curve slope downward?</h2><p>Select the <b>five Frank reasons</b>.</p><div class="answers" id="opts"></div><button class="btn primary" id="check">Check</button><div id="fb" class="feedback"></div>`;
 const options=shuffle([
  ["Diminishing marginal utility",true],["Income effect",true],["Substitution effect",true],["Increase in number of consumers",true],["Several uses of a commodity",true],["Rising cost of production",false],["Law of supply",false]
 ]);
 $("opts").innerHTML=options.map((x,i)=>`<button class="ans" data-i="${i}">${x[0]}</button>`).join("");
 const picked=new Set();document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(picked.has(i)){picked.delete(i);b.style.background="#fff"}else{picked.add(i);b.style.background="#efefff"}});
 $("check").onclick=()=>{const ok=options.every((x,i)=>x[1]===picked.has(i));fb(ok,ok?"All five reasons selected":"Check the list",ok?"For the exam: diminishing marginal utility, income effect, substitution effect, increase in number of consumers, and several uses of a commodity.":"There are exactly five Frank reasons. Cost and supply explanations do not belong here.");ok?reward("board",120):miss()}
}
function renderBoss(){
 quiz("Demand 3 Final Boss",[
  {q:"A lower price makes the same ₹1,000 budget able to buy more.",a:["Income effect","Substitution effect","Several uses","Snob appeal"],c:0,why:"Purchasing power increased."},
  {q:"A lower tea price causes some coffee drinkers to switch.",a:["Substitution effect","Giffen effect","Emergency","More consumers"],c:0,why:"Relative prices of substitutes changed."},
  {q:"Electricity becomes cheaper and is used for additional appliances.",a:["Several uses","Income effect only","Giffen","Quality-price"],c:0,why:"The same commodity is extended to more uses."},
  {q:"The fifth unit gives much less extra satisfaction than the first.",a:["Diminishing marginal utility","Composite demand","Cross demand","Emergency"],c:0,why:"Marginal utility declines across successive units."},
  {q:"A cheaper online course attracts people who previously would not buy.",a:["Increase in number of consumers","Several uses","Giffen","Income demand"],c:0,why:"The lower price brings additional consumers into the market."},
  {q:"A prestige watch is attractive partly because the high price signals exclusivity.",a:["Snob/Veblen","Income effect","Several uses","Ex-post"],c:0,why:"High price contributes to status appeal."},
  {q:"People buy more today because they expect an even higher price next week.",a:["Future-price expectations","Giffen only","Substitution effect","DMU"],c:0,why:"Expectations changed current buying."},
  {q:"Price and sales rose after a celebrity endorsement. Is that automatically a Law-of-Demand exception?",a:["Yes","No — tastes may have shifted demand","Only if supply rose","It proves Giffen behaviour"],c:1,why:"Celebrity endorsement changes tastes, so ceteris paribus fails."},
  {q:"Which statement is safest?",a:["Every inferior good is Giffen","Giffen goods are a special case, not all inferior goods","All luxury goods are Veblen goods","Emergencies never affect demand"],c:1,why:"Giffen behaviour requires restrictive conditions."},
  {q:"A textbook exception curve with price and quantity moving in the same direction slopes...",a:["Upward","Downward","Horizontally","Vertically"],c:0,why:"A positive relationship produces an upward-sloping curve."}
 ],"boss")
}

$("sound").onclick=()=>{state.sound=!state.sound;save();header()};
render();
