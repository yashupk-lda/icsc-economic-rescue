<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demand Mission 3</title><style>.homeLink{text-decoration:none;color:inherit}.homeLink:hover{text-decoration:underline}
:root{--bg:#f7f3eb;--card:#fff;--ink:#17202d;--muted:#667085;--line:#e4dfd5;--accent:#5b5bd6;--accent2:#8b5cf6;--soft:#efefff;--good:#146b42;--goodbg:#eaf7ef;--bad:#9e241b;--badbg:#fff0ed;--warn:#795600;--warnbg:#fff7d6;--dark:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}
.app{max-width:1050px;margin:auto;padding:16px 16px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:950;letter-spacing:-.03em}
.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:13px;font-weight:850}.bar{height:9px;background:#e7e3da;border-radius:999px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,38px);box-shadow:0 12px 30px rgba(16,24,40,.05)}.eyebrow{font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h1{font-size:clamp(34px,6vw,62px);line-height:.97;letter-spacing:-.05em;margin:0 0 15px}h2{font-size:clamp(27px,4vw,43px);line-height:1.04;letter-spacing:-.035em;margin:0 0 13px}p{font-size:18px;line-height:1.5;color:#344054}.big{font-size:23px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.panel{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.soft{background:var(--soft)}.goodbg{background:var(--goodbg)}.warnbg{background:var(--warnbg)}
.scene{border-radius:20px;padding:18px;background:linear-gradient(135deg,#191f2b,#293143);color:#fff}.scene p{color:#dce2ec}.bigIcon{font-size:60px}.sceneTitle{font-size:22px;font-weight:900;margin-top:8px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer;min-height:44px}.primary{background:var(--dark);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.softBtn{background:var(--soft);color:#4039b2}
.answers{display:grid;gap:10px;margin:16px 0}.ans{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer;font-weight:760;min-height:52px}.ans:hover{background:#fcfbff;border-color:#b5b1ef}.ans.correct{background:var(--goodbg);border-color:#83c7a3}.ans.wrong{background:var(--badbg);border-color:#e0a09a}
.feedback{display:none;padding:14px 15px;border-radius:14px;margin:14px 0;line-height:1.45}.feedback.show{display:block}.feedback.good{background:var(--goodbg);color:var(--good)}.feedback.bad{background:var(--badbg);color:var(--bad)}.feedback.hint{background:var(--warnbg);color:var(--warn)}
.chartwrap{background:#fbfbfd;border:1px solid var(--line);border-radius:18px;padding:8px}canvas{width:100%;height:320px;display:block}.labels{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tag{padding:7px 10px;border-radius:999px;background:#f1f1ff;font-size:12px;font-weight:850}
.board{border-left:4px solid var(--accent);padding-left:15px;margin:17px 0}.range{width:100%;accent-color:#8b85ff}.meter{height:14px;background:#ece9e2;border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#5b5bd6,#8b5cf6)}.value{font-size:42px;font-weight:950;letter-spacing:-.04em}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;width:10px;height:14px;animation:fall 1.25s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:0}}.hidden{display:none!important}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}canvas{height:270px}.bigIcon{font-size:52px}}
</style></head>
<body><div class="app"><div class="top"><a class="brand homeLink" href="index.html">ECONOMICS RESCUE <span style="color:#777">/ DEMAND 3/6</span></a><div class="stats"><div class="pill">⭐ <span id="xp">0</span> XP</div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🔊 <span id="snd">ON</span></div></div></div><div class="bar"><div class="fill" id="fill"></div></div><main class="card" id="main"></main><div class="actions"><button class="btn secondary" id="back">← Back</button><button class="btn softBtn" id="hint">I don't get it</button><button class="btn softBtn" id="sound">Sound on/off</button><button class="btn primary" id="next">Continue →</button></div></div><div id="confetti" class="confetti hidden"></div>
<script>
const KEY="econ_demand_m3";let state=Object.assign({i:0,xp:0,streak:0,sound:true,answered:{},rewarded:{}},JSON.parse(localStorage.getItem(KEY)||"{}"));

const screens=[{t:"intro"},{t:"reasons"},{t:"exception"},{t:"q",q:"A price fall makes a good cheaper relative to substitutes, so buyers switch toward it. Which reason for downward-sloping demand is this?",a:["Substitution effect","Prestige effect","Supply effect"],c:0,h:"The key word is switching between alternatives."},{t:"q",q:"A luxury watch becomes more desirable to some buyers because its very high price signals status. This is closest to:",a:["Ordinary law-of-demand behaviour","A prestige/Veblen-type exception","Movement of supply"],c:1,h:"Here, the high price itself can add status appeal."},{t:"finish"}];


function tone(kind){if(!state.sound)return;try{const C=new(window.AudioContext||window.webkitAudioContext)(),o=C.createOscillator(),g=C.createGain();const m={click:[430,520,.05],good:[620,880,.10],bad:[220,170,.12],win:[523,1046,.24]}[kind]||[430,520,.05];o.connect(g);g.connect(C.destination);o.frequency.setValueAtTime(m[0],C.currentTime);o.frequency.exponentialRampToValueAtTime(m[1],C.currentTime+m[2]);g.gain.setValueAtTime(.035,C.currentTime);g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+m[2]);o.start();o.stop(C.currentTime+m[2])}catch(e){}}
function burst(){const c=document.getElementById("confetti");c.innerHTML="";c.classList.remove("hidden");const cs=["#5b5bd6","#ffd166","#34d399","#60a5fa","#f472b6"];for(let i=0;i<30;i++){const d=document.createElement("div");d.className="piece";d.style.left=Math.random()*100+"vw";d.style.top=(-20-Math.random()*30)+"px";d.style.background=cs[Math.floor(Math.random()*cs.length)];c.appendChild(d)}setTimeout(()=>c.classList.add("hidden"),1300)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem("econ_total_xp",String(Number(localStorage.getItem("econ_total_xp")||0)))}
function reward(n=45){if(!state.rewarded[state.i]){state.rewarded[state.i]=1;state.xp+=n;localStorage.setItem("econ_total_xp",String(Number(localStorage.getItem("econ_total_xp")||0)+n));burst()}state.streak++;tone("good");save();header()}
function miss(){state.streak=0;tone("bad");save();header()}
function header(){document.getElementById("xp").textContent=state.xp;document.getElementById("streak").textContent=state.streak;document.getElementById("snd").textContent=state.sound?"ON":"OFF";document.getElementById("fill").style.width=((state.i+1)/screens.length*100)+"%";document.getElementById("back").disabled=state.i===0}
function bindMCQ(s){document.querySelectorAll(".ans").forEach(b=>b.addEventListener("click",()=>{if(state.answered[state.i])return;const ok=Number(b.dataset.i)===s.c,f=document.getElementById("fb");if(ok){b.classList.add("correct");f.className="feedback show good";f.textContent="✓ Correct.";state.answered[state.i]=1;reward(45)}else{b.classList.add("wrong");f.className="feedback show bad";f.textContent="Not quite. "+s.h;miss();setTimeout(()=>b.classList.remove("wrong"),600)}}))}


function render(){header();const s=screens[state.i],m=document.getElementById("main");
if(s.t==="intro")m.innerHTML=`<div class="eyebrow">Mission 3 • Why D slopes down</div><h1>Why does cheaper usually mean more?</h1><p class="big">Don't memorize “negative slope.” Understand the reasons underneath it.</p>`;
else if(s.t==="reasons")m.innerHTML=`<div class="eyebrow">Three big intuitions</div><div class="grid3"><div class="panel"><div class="bigIcon">🔁</div><b>Substitution effect</b><p>A cheaper good looks better compared with alternatives.</p></div><div class="panel"><div class="bigIcon">💰</div><b>Income effect</b><p>A lower price makes your money stretch further.</p></div><div class="panel"><div class="bigIcon">🍕🍕🍕</div><b>Diminishing utility</b><p>Extra units are usually worth less to you, so you buy more only at lower prices.</p></div></div>`;
else if(s.t==="exception")m.innerHTML=`<div class="eyebrow">Exceptions</div><h2>Sometimes the usual rule gets weird.</h2><div class="grid2"><div class="scene"><div class="bigIcon">⌚👑</div><b>Prestige / conspicuous goods</b><p>For some status goods, a high price can itself add appeal.</p></div><div class="panel"><div class="bigIcon">🥔💸</div><b>Giffen-type case</b><p>Under very restrictive conditions for an inferior staple, the normal relationship can reverse.</p></div></div><div class="feedback show hint">For exams, know that exceptions exist. Do not treat them as the normal case.</div>`;
else if(s.t==="q"){m.innerHTML=`<div class="eyebrow">Quick check</div><h2>${s.q}</h2><div class="answers">${s.a.map((x,i)=>`<button class="ans" data-i="${i}">${x}</button>`).join("")}</div><div id="fb" class="feedback"></div>`;setTimeout(()=>bindMCQ(s),0)}
else m.innerHTML=`<div class="eyebrow">Mission complete</div><h1>Curve Detective 🔎</h1><p>You know why demand usually slopes downward and why exceptions need special conditions.</p>`;
save()}


document.getElementById("next").addEventListener("click",()=>{if(state.i<screens.length-1){state.i++;render();window.scrollTo({top:0,behavior:"smooth"})}else{window.location.href="demand-4.html"}});
document.getElementById("back").addEventListener("click",()=>{if(state.i>0){state.i--;render()}else{window.location.href="demand-2.html"}});
document.getElementById("hint").addEventListener("click",()=>{const d=document.createElement("div");d.className="feedback show hint";d.innerHTML="<b>Smaller step:</b> "+(screens[state.i].h||"Focus on what changed and what the graph/table is showing.");document.getElementById("main").appendChild(d);tone("click")});
document.getElementById("sound").addEventListener("click",()=>{state.sound=!state.sound;save();header()});
render();
</script></body></html>
